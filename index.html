<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LIVE MIX VJ FX</title>
<style>
:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.88);
  --line:rgba(255,255,255,.14);
  --text:#f4f4f4;
  --muted:#9a9a9a;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Helvetica,Arial,sans-serif
}
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#mixCanvas{width:100%;height:100%;display:block;background:#000}
#topbar{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:10;pointer-events:none
}
.brand{font-size:13px;font-weight:700;letter-spacing:.13em;text-shadow:0 1px 8px #000}
.status{
  font-size:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);
  padding:7px 10px;border-radius:999px;backdrop-filter:blur(8px)
}

#panel{
  height:360px;
  display:grid;
  grid-template-columns:1fr 1fr .9fr;
  background:var(--panel);
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px)
}
.section{min-width:0;padding:12px;border-right:1px solid var(--line);overflow:auto}
.section:last-child{border-right:0}
h3{font-size:11px;letter-spacing:.16em;margin:0 0 10px;color:#ddd}
h4{
  font-size:10px;letter-spacing:.13em;margin:15px 0 8px;color:#999;
  border-top:1px solid var(--line);padding-top:10px
}
.buttonrow{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
button,.filebtn,select{
  border:1px solid var(--line);background:#151515;color:#eee;
  border-radius:7px;font-size:10px;font-family:inherit
}
button,.filebtn{padding:8px 9px;cursor:pointer}
button.active{background:#eee;color:#111}
button:hover,.filebtn:hover{background:#222}
input[type=file]{display:none}
.filebtn{display:inline-block}
select{padding:7px;width:100%}
.row{
  display:grid;
  grid-template-columns:84px 1fr 42px;
  gap:7px;align-items:center;margin:7px 0
}
.row label{font-size:10px;color:#b7b7b7}
.value{font-size:9px;color:#888;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#fff}
.name{font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0 7px}
.fxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fxgrid button{width:100%}
.meter{height:4px;background:#171717;border-radius:99px;overflow:hidden;margin-top:8px}
.meter span{display:block;width:0;height:100%;background:#eee}
.tip{font-size:9px;color:#707070;line-height:1.5;margin-top:9px}
#videos{display:none}

@media(max-width:900px){
  #panel{height:46vh;grid-template-columns:1fr 1fr}
  .section.mix{grid-column:1/-1;border-top:1px solid var(--line)}
}
@media(max-width:600px){
  #panel{height:52vh}
  .section{padding:9px}
  .row{grid-template-columns:68px 1fr 36px;gap:5px}
  .brand{font-size:11px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="mixCanvas"></canvas>
  <div id="topbar">
    <div class="brand">LIVE MIX VJ FX</div>
    <div id="status" class="status">READY</div>
  </div>
</div>

<div id="panel">
  <section class="section" id="sectionA">
    <h3>VIDEO A</h3>
    <div class="buttonrow">
      <label class="filebtn">LOAD A<input id="fileA" type="file" accept="video/*"></label>
      <button id="cameraA">CAMERA A</button>
      <button id="playA">PLAY</button>
      <button id="mirrorA">MIRROR</button>
      <button id="loopA" class="active">LOOP</button>
    </div>
    <div id="nameA" class="name">NO VIDEO</div>
    <div class="row"><label>OPACITY</label><input id="opacityA" type="range" min="0" max="1" step="0.01" value="1"><span id="opacityAVal" class="value"></span></div>
    <div class="row"><label>SPEED</label><input id="speedA" type="range" min="0.1" max="3" step="0.05" value="1"><span id="speedAVal" class="value"></span></div>

    <h4>FX A</h4>
    <div class="fxgrid">
      <button id="rgbA">RGB SHIFT</button>
      <button id="glitchA">GLITCH</button>
      <button id="pixelA">PIXELATE</button>
      <button id="halfA">HALFTONE</button>
      <button id="feedbackA">FEEDBACK</button>
      <button id="invertA">INVERT</button>
    </div>
    <div class="row"><label>RGB</label><input id="rgbAmtA" type="range" min="0" max="40" step="1" value="10"><span id="rgbAmtAVal" class="value"></span></div>
    <div class="row"><label>GLITCH</label><input id="glitchAmtA" type="range" min="0" max="1" step="0.01" value="0.35"><span id="glitchAmtAVal" class="value"></span></div>
    <div class="row"><label>PIXEL</label><input id="pixelAmtA" type="range" min="1" max="48" step="1" value="10"><span id="pixelAmtAVal" class="value"></span></div>
    <div class="row"><label>HALFTONE</label><input id="halfAmtA" type="range" min="3" max="24" step="1" value="8"><span id="halfAmtAVal" class="value"></span></div>
    <div class="row"><label>FEEDBACK</label><input id="feedbackAmtA" type="range" min="0" max="0.97" step="0.01" value="0.72"><span id="feedbackAmtAVal" class="value"></span></div>
    <div class="row"><label>HUE</label><input id="hueA" type="range" min="0" max="360" step="1" value="0"><span id="hueAVal" class="value"></span></div>
  </section>

  <section class="section" id="sectionB">
    <h3>VIDEO B</h3>
    <div class="buttonrow">
      <label class="filebtn">LOAD B<input id="fileB" type="file" accept="video/*"></label>
      <button id="cameraB">CAMERA B</button>
      <button id="playB">PLAY</button>
      <button id="mirrorB">MIRROR</button>
      <button id="loopB" class="active">LOOP</button>
    </div>
    <div id="nameB" class="name">NO VIDEO</div>
    <div class="row"><label>OPACITY</label><input id="opacityB" type="range" min="0" max="1" step="0.01" value="1"><span id="opacityBVal" class="value"></span></div>
    <div class="row"><label>SPEED</label><input id="speedB" type="range" min="0.1" max="3" step="0.05" value="1"><span id="speedBVal" class="value"></span></div>

    <h4>FX B</h4>
    <div class="fxgrid">
      <button id="rgbB">RGB SHIFT</button>
      <button id="glitchB">GLITCH</button>
      <button id="pixelB">PIXELATE</button>
      <button id="halfB">HALFTONE</button>
      <button id="feedbackB">FEEDBACK</button>
      <button id="invertB">INVERT</button>
    </div>
    <div class="row"><label>RGB</label><input id="rgbAmtB" type="range" min="0" max="40" step="1" value="10"><span id="rgbAmtBVal" class="value"></span></div>
    <div class="row"><label>GLITCH</label><input id="glitchAmtB" type="range" min="0" max="1" step="0.01" value="0.35"><span id="glitchAmtBVal" class="value"></span></div>
    <div class="row"><label>PIXEL</label><input id="pixelAmtB" type="range" min="1" max="48" step="1" value="10"><span id="pixelAmtBVal" class="value"></span></div>
    <div class="row"><label>HALFTONE</label><input id="halfAmtB" type="range" min="3" max="24" step="1" value="8"><span id="halfAmtBVal" class="value"></span></div>
    <div class="row"><label>FEEDBACK</label><input id="feedbackAmtB" type="range" min="0" max="0.97" step="0.01" value="0.72"><span id="feedbackAmtBVal" class="value"></span></div>
    <div class="row"><label>HUE</label><input id="hueB" type="range" min="0" max="360" step="1" value="0"><span id="hueBVal" class="value"></span></div>
  </section>

  <section class="section mix">
    <h3>MIX / OUTPUT</h3>
    <div class="row"><label>CROSSFADE</label><input id="crossfade" type="range" min="0" max="1" step="0.01" value="0.5"><span id="crossfadeVal" class="value"></span></div>
    <div class="row">
      <label>BLEND</label>
      <select id="blendMode">
        <option value="source-over">NORMAL</option>
        <option value="screen">SCREEN</option>
        <option value="multiply">MULTIPLY</option>
        <option value="overlay">OVERLAY</option>
        <option value="lighten">LIGHTEN</option>
        <option value="darken">DARKEN</option>
        <option value="difference">DIFFERENCE</option>
        <option value="exclusion">EXCLUSION</option>
        <option value="color-dodge">COLOR DODGE</option>
        <option value="color-burn">COLOR BURN</option>
        <option value="hard-light">HARD LIGHT</option>
        <option value="soft-light">SOFT LIGHT</option>
      </select><span></span>
    </div>
    <div class="row"><label>MASTER</label><input id="master" type="range" min="0" max="1" step="0.01" value="1"><span id="masterVal" class="value"></span></div>

    <div class="buttonrow">
      <button id="playBoth">PLAY BOTH</button>
      <button id="pauseBoth">PAUSE BOTH</button>
      <button id="sync">SYNC</button>
      <button id="fullscreen">FULLSCREEN</button>
      <button id="record">● REC</button>
      <button id="resetFx">RESET FX</button>
    </div>

    <div class="meter"><span id="recMeter"></span></div>
    <div class="tip">
      SPACE: PLAY/PAUSE BOTH<br>
      1: A / 2: 50:50 / 3: B<br>
      Q/W/E/R/T/Y/U = FX A toggle<br>
      A/S/D/F/G/H/J = FX B toggle
    </div>
  </section>
</div>

<div id="videos">
  <video id="videoA" playsinline muted></video>
  <video id="videoB" playsinline muted></video>
</div>

<script>
const $ = id => document.getElementById(id);

const canvas = $('mixCanvas');
const ctx = canvas.getContext('2d', {alpha:false});
const stage = $('stage');
const statusEl = $('status');

const videoA = $('videoA');
const videoB = $('videoB');

// Each channel uses: sourceCanvas -> ping -> pong -> output.
// This prevents an FX from erasing its own source.
function makeChannelBuffers(){
  const source = document.createElement('canvas');
  const ping = document.createElement('canvas');
  const pong = document.createElement('canvas');
  const output = document.createElement('canvas');
  const feedback = document.createElement('canvas');
  const sample = document.createElement('canvas');
  return {
    source, ping, pong, output, feedback, sample,
    sourceCtx: source.getContext('2d'),
    pingCtx: ping.getContext('2d'),
    pongCtx: pong.getContext('2d'),
    outputCtx: output.getContext('2d'),
    feedbackCtx: feedback.getContext('2d'),
    sampleCtx: sample.getContext('2d')
  };
}
const chA = makeChannelBuffers();
const chB = makeChannelBuffers();

const state = {
  mirrorA:false, mirrorB:false,
  recording:false, recorder:null, chunks:[],
  streamA:null, streamB:null,
  fxA:{rgb:false,glitch:false,pixel:false,half:false,feedback:false,invert:false},
  fxB:{rgb:false,glitch:false,pixel:false,half:false,feedback:false,invert:false}
};

function allCanvases(ch){
  return [ch.source,ch.ping,ch.pong,ch.output,ch.feedback,ch.sample];
}
function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width*dpr));
  const h = Math.max(1, Math.round(r.height*dpr));
  canvas.width=w; canvas.height=h;
  [chA,chB].forEach(ch => {
    [ch.source,ch.ping,ch.pong,ch.output,ch.feedback].forEach(c=>{c.width=w;c.height=h});
    // sample is resized on demand for halftone.
    ch.sample.width=Math.max(1,Math.round(w*.18));
    ch.sample.height=Math.max(1,Math.round(h*.18));
  });
}
window.addEventListener('resize',resize);
resize();

function coverRect(vw,vh,cw,ch){
  const s=Math.max(cw/vw,ch/vh);
  const w=vw*s,h=vh*s;
  return [(cw-w)/2,(ch-h)/2,w,h];
}

function drawBase(video,c,mirror){
  c.save();
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1;
  c.globalCompositeOperation='source-over';
  c.filter='none';
  c.clearRect(0,0,c.canvas.width,c.canvas.height);

  if(video.readyState < 2 || !video.videoWidth || !video.videoHeight){
    c.restore();
    return false;
  }

  const [x,y,w,h]=coverRect(video.videoWidth,video.videoHeight,c.canvas.width,c.canvas.height);
  if(mirror){
    c.translate(c.canvas.width,0);
    c.scale(-1,1);
    c.drawImage(video,c.canvas.width-(x+w),y,w,h);
  }else{
    c.drawImage(video,x,y,w,h);
  }
  c.restore();
  return true;
}

function clearCtx(c){
  c.save();
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1;
  c.globalCompositeOperation='source-over';
  c.filter='none';
  c.clearRect(0,0,c.canvas.width,c.canvas.height);
  c.restore();
}

function copyCanvas(src,dstCtx){
  clearCtx(dstCtx);
  dstCtx.drawImage(src,0,0);
}

// FX functions always read one canvas and write a DIFFERENT canvas.
function fxColor(src,dstCtx,hue,invert){
  clearCtx(dstCtx);
  dstCtx.save();
  dstCtx.filter=`hue-rotate(${hue}deg) ${invert?'invert(1)':'invert(0)'}`;
  dstCtx.drawImage(src,0,0);
  dstCtx.restore();
}

function fxPixelate(src,dstCtx,size,ch){
  const scale=Math.max(1,+size);
  const sw=Math.max(1,Math.floor(src.width/scale));
  const sh=Math.max(1,Math.floor(src.height/scale));

  ch.sample.width=sw; ch.sample.height=sh;
  const sctx=ch.sampleCtx;
  sctx.imageSmoothingEnabled=false;
  sctx.clearRect(0,0,sw,sh);
  sctx.drawImage(src,0,0,sw,sh);

  clearCtx(dstCtx);
  dstCtx.imageSmoothingEnabled=false;
  dstCtx.drawImage(ch.sample,0,0,dstCtx.canvas.width,dstCtx.canvas.height);
  dstCtx.imageSmoothingEnabled=true;
}

function fxRGB(src,dstCtx,amt){
  clearCtx(dstCtx);
  dstCtx.drawImage(src,0,0);
  dstCtx.save();
  dstCtx.globalCompositeOperation='screen';
  dstCtx.globalAlpha=.72;
  dstCtx.filter='sepia(1) saturate(10) hue-rotate(-55deg)';
  dstCtx.drawImage(src,-amt,0);
  dstCtx.filter='sepia(1) saturate(10) hue-rotate(65deg)';
  dstCtx.drawImage(src,amt,0);
  dstCtx.restore();
}

function fxGlitch(src,dstCtx,amt,t){
  clearCtx(dstCtx);
  dstCtx.drawImage(src,0,0);
  if(amt<=0) return;

  const slices=Math.floor(3+amt*20);
  const maxShift=10+amt*100;
  for(let i=0;i<slices;i++){
    if(Math.random()>0.45+amt*.4) continue;
    const h=Math.max(2,Math.floor(Math.random()*dstCtx.canvas.height*.08));
    const y=Math.floor(Math.random()*(dstCtx.canvas.height-h));
    const shift=(Math.random()*2-1)*maxShift;
    dstCtx.drawImage(src,0,y,src.width,h,shift,y,src.width,h);
  }
  if(Math.random()<amt*.35){
    dstCtx.save();
    dstCtx.globalCompositeOperation='difference';
    dstCtx.globalAlpha=.15+amt*.35;
    const x=(Math.sin(t*.01)*.5+.5)*18*amt;
    dstCtx.drawImage(src,x,0);
    dstCtx.restore();
  }
}

function fxHalftone(src,dstCtx,step,ch){
  clearCtx(dstCtx);

  const sw=Math.max(1,Math.floor(src.width*.16));
  const sh=Math.max(1,Math.floor(src.height*.16));
  ch.sample.width=sw; ch.sample.height=sh;
  const sctx=ch.sampleCtx;
  sctx.clearRect(0,0,sw,sh);
  sctx.drawImage(src,0,0,sw,sh);

  let data;
  try{
    data=sctx.getImageData(0,0,sw,sh).data;
  }catch(err){
    // Fallback: never black out if pixel access fails.
    dstCtx.drawImage(src,0,0);
    return;
  }

  const sx=src.width/sw, sy=src.height/sh;
  const gap=Math.max(3,+step);
  dstCtx.fillStyle='#000';
  dstCtx.fillRect(0,0,dstCtx.canvas.width,dstCtx.canvas.height);

  const dx=Math.max(1,Math.round(gap/sx));
  const dy=Math.max(1,Math.round(gap/sy));

  for(let y=0;y<sh;y+=dy){
    for(let x=0;x<sw;x+=dx){
      const i=(y*sw+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2];
      const lum=(r+g+b)/765;
      const radius=Math.max(.8,(gap*.52)*(1-lum*.72));
      dstCtx.fillStyle=`rgb(${r},${g},${b})`;
      dstCtx.beginPath();
      dstCtx.arc(x*sx,y*sy,radius,0,Math.PI*2);
      dstCtx.fill();
    }
  }
}

function fxFeedback(src,dstCtx,ch,amt){
  const fb=ch.feedbackCtx;
  const c=ch.feedback;

  // Preserve the prior feedback frame and gently zoom it.
  const temp=ch.sample;
  temp.width=c.width; temp.height=c.height;
  ch.sampleCtx.clearRect(0,0,temp.width,temp.height);
  ch.sampleCtx.drawImage(c,0,0);

  fb.save();
  fb.setTransform(1,0,0,1,0,0);
  fb.globalCompositeOperation='source-over';
  fb.globalAlpha=1;
  fb.fillStyle='rgba(0,0,0,0.08)';
  fb.fillRect(0,0,c.width,c.height);
  fb.globalAlpha=amt;
  fb.drawImage(temp,-3,-3,c.width+6,c.height+6);
  fb.globalAlpha=1;
  fb.globalCompositeOperation='screen';
  fb.drawImage(src,0,0);
  fb.restore();

  copyCanvas(c,dstCtx);
}

function processChannel(video,mirror,fxState,controls,ch,t){
  if(!drawBase(video,ch.sourceCtx,mirror)){
    clearCtx(ch.outputCtx);
    return;
  }

  let current=ch.source;
  let writeCtx=ch.pingCtx;

  // Always do the color stage first; ping/pong afterwards.
  fxColor(current,writeCtx,+controls.hue.value,fxState.invert);
  current=ch.ping;
  let nextCtx=ch.pongCtx;

  const runStage=(fn)=>{
    fn(current,nextCtx);
    current=nextCtx.canvas;
    nextCtx=(nextCtx===ch.pingCtx)?ch.pongCtx:ch.pingCtx;
  };

  if(fxState.pixel){
    runStage((src,dst)=>fxPixelate(src,dst,+controls.pixelAmt.value,ch));
  }
  if(fxState.rgb){
    runStage((src,dst)=>fxRGB(src,dst,+controls.rgbAmt.value));
  }
  if(fxState.glitch){
    runStage((src,dst)=>fxGlitch(src,dst,+controls.glitchAmt.value,t));
  }
  if(fxState.half){
    runStage((src,dst)=>fxHalftone(src,dst,+controls.halfAmt.value,ch));
  }
  if(fxState.feedback){
    runStage((src,dst)=>fxFeedback(src,dst,ch,+controls.feedbackAmt.value));
  }

  copyCanvas(current,ch.outputCtx);
}

const controlsA={
  hue:$('hueA'), rgbAmt:$('rgbAmtA'), glitchAmt:$('glitchAmtA'),
  pixelAmt:$('pixelAmtA'), halfAmt:$('halfAmtA'), feedbackAmt:$('feedbackAmtA')
};
const controlsB={
  hue:$('hueB'), rgbAmt:$('rgbAmtB'), glitchAmt:$('glitchAmtB'),
  pixelAmt:$('pixelAmtB'), halfAmt:$('halfAmtB'), feedbackAmt:$('feedbackAmtB')
};

function render(t=0){
  processChannel(videoA,state.mirrorA,state.fxA,controlsA,chA,t);
  processChannel(videoB,state.mirrorB,state.fxB,controlsB,chB,t);

  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const cross=+$('crossfade').value;
  const master=+$('master').value;

  ctx.globalAlpha=(1-cross)*+$('opacityA').value*master;
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(chA.output,0,0);

  ctx.globalAlpha=cross*+$('opacityB').value*master;
  ctx.globalCompositeOperation=$('blendMode').value;
  ctx.drawImage(chB.output,0,0);
  ctx.restore();

  if(state.recording){
    $('recMeter').style.width=((performance.now()-state.recStart)%2000)/20+'%';
  }else{
    $('recMeter').style.width='0%';
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ---------- VIDEO / CAMERA INPUT ----------
function stopStream(key,buttonId){
  const stream=state[key];
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    state[key]=null;
  }
  $(buttonId).classList.remove('active');
}

function setFileVideo(input,video,nameEl,streamKey,cameraButtonId){
  const file=input.files?.[0];
  if(!file)return;

  stopStream(streamKey,cameraButtonId);
  video.pause();
  video.srcObject=null;

  if(video.dataset.url) URL.revokeObjectURL(video.dataset.url);
  const url=URL.createObjectURL(file);
  video.dataset.url=url;
  video.src=url;
  video.loop=true;
  video.muted=true;
  video.playsInline=true;
  video.load();
  nameEl.textContent=file.name;

  video.addEventListener('loadeddata',()=>{
    video.play().catch(()=>{});
    statusEl.textContent='LIVE';
  },{once:true});
}

$('fileA').onchange=()=>setFileVideo($('fileA'),videoA,$('nameA'),'streamA','cameraA');
$('fileB').onchange=()=>setFileVideo($('fileB'),videoB,$('nameB'),'streamB','cameraB');

async function toggleCamera(which){
  const isA=which==='A';
  const video=isA?videoA:videoB;
  const streamKey=isA?'streamA':'streamB';
  const btnId=isA?'cameraA':'cameraB';
  const nameId=isA?'nameA':'nameB';

  if(state[streamKey]){
    stopStream(streamKey,btnId);
    video.srcObject=null;
    video.removeAttribute('src');
    video.load();
    $(nameId).textContent='NO VIDEO';
    return;
  }

  try{
    // Stop a previously loaded object URL on this channel.
    if(video.dataset.url){
      URL.revokeObjectURL(video.dataset.url);
      delete video.dataset.url;
    }
    video.pause();
    video.removeAttribute('src');

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30,max:60}
      },
      audio:false
    });

    state[streamKey]=stream;
    video.srcObject=stream;
    video.muted=true;
    video.playsInline=true;
    await video.play();

    $(btnId).classList.add('active');
    $(nameId).textContent='LIVE CAMERA';
    statusEl.textContent='CAMERA LIVE';
  }catch(err){
    console.error(err);
    statusEl.textContent='CAMERA ERROR';
    alert(
      'Webカメラを起動できませんでした。\\n\\n' +
      '・ブラウザのカメラ許可を確認してください。\\n' +
      '・GitHub PagesなどHTTPS環境で開いてください。\\n' +
      '・file:// で直接開く場合、ブラウザによってはカメラが使えません。'
    );
  }
}
$('cameraA').onclick=()=>toggleCamera('A');
$('cameraB').onclick=()=>toggleCamera('B');

// ---------- PLAYBACK ----------
function hasMedia(video){
  return !!video.srcObject || !!video.currentSrc || !!video.src;
}
function togglePlay(video,btn){
  if(!hasMedia(video))return;
  if(video.paused){
    video.play().catch(()=>{});
    btn.textContent='PAUSE';
  }else{
    video.pause();
    btn.textContent='PLAY';
  }
}
$('playA').onclick=()=>togglePlay(videoA,$('playA'));
$('playB').onclick=()=>togglePlay(videoB,$('playB'));

$('playBoth').onclick=()=>{
  if(hasMedia(videoA))videoA.play().catch(()=>{});
  if(hasMedia(videoB))videoB.play().catch(()=>{});
  $('playA').textContent='PAUSE';
  $('playB').textContent='PAUSE';
};
$('pauseBoth').onclick=()=>{
  videoA.pause();videoB.pause();
  $('playA').textContent='PLAY';
  $('playB').textContent='PLAY';
};
$('sync').onclick=()=>{
  if(!videoA.srcObject && isFinite(videoA.duration)) videoA.currentTime=0;
  if(!videoB.srcObject && isFinite(videoB.duration)) videoB.currentTime=0;
  if(hasMedia(videoA))videoA.play().catch(()=>{});
  if(hasMedia(videoB))videoB.play().catch(()=>{});
};

$('mirrorA').onclick=()=>{
  state.mirrorA=!state.mirrorA;
  $('mirrorA').classList.toggle('active',state.mirrorA);
};
$('mirrorB').onclick=()=>{
  state.mirrorB=!state.mirrorB;
  $('mirrorB').classList.toggle('active',state.mirrorB);
};
$('loopA').onclick=()=>{
  videoA.loop=!videoA.loop;
  $('loopA').classList.toggle('active',videoA.loop);
};
$('loopB').onclick=()=>{
  videoB.loop=!videoB.loop;
  $('loopB').classList.toggle('active',videoB.loop);
};

// ---------- FX UI ----------
function toggleFx(which,key,btn){
  state[which][key]=!state[which][key];
  btn.classList.toggle('active',state[which][key]);
}
const mapA=[
  ['rgbA','rgb'],['glitchA','glitch'],['pixelA','pixel'],
  ['halfA','half'],['feedbackA','feedback'],['invertA','invert']
];
const mapB=[
  ['rgbB','rgb'],['glitchB','glitch'],['pixelB','pixel'],
  ['halfB','half'],['feedbackB','feedback'],['invertB','invert']
];
mapA.forEach(([id,key])=>$(id).onclick=()=>toggleFx('fxA',key,$(id)));
mapB.forEach(([id,key])=>$(id).onclick=()=>toggleFx('fxB',key,$(id)));

function bindRange(id,valId,cb){
  const el=$(id), val=$(valId);
  const update=()=>{
    const n=+el.value;
    val.textContent=n.toFixed(el.step && +el.step<1?2:0);
    if(cb)cb(n);
  };
  el.addEventListener('input',update);
  update();
}
[
  ['opacityA','opacityAVal'],
  ['speedA','speedAVal',v=>{ if(!videoA.srcObject) videoA.playbackRate=v; }],
  ['rgbAmtA','rgbAmtAVal'],['glitchAmtA','glitchAmtAVal'],
  ['pixelAmtA','pixelAmtAVal'],['halfAmtA','halfAmtAVal'],
  ['feedbackAmtA','feedbackAmtAVal'],['hueA','hueAVal'],

  ['opacityB','opacityBVal'],
  ['speedB','speedBVal',v=>{ if(!videoB.srcObject) videoB.playbackRate=v; }],
  ['rgbAmtB','rgbAmtBVal'],['glitchAmtB','glitchAmtBVal'],
  ['pixelAmtB','pixelAmtBVal'],['halfAmtB','halfAmtBVal'],
  ['feedbackAmtB','feedbackAmtBVal'],['hueB','hueBVal'],

  ['crossfade','crossfadeVal'],['master','masterVal']
].forEach(args=>bindRange(...args));

$('resetFx').onclick=()=>{
  Object.keys(state.fxA).forEach(k=>state.fxA[k]=false);
  Object.keys(state.fxB).forEach(k=>state.fxB[k]=false);
  [...mapA,...mapB].forEach(([id])=>$(id).classList.remove('active'));

  $('hueA').value=0;$('hueB').value=0;
  $('rgbAmtA').value=10;$('rgbAmtB').value=10;
  $('glitchAmtA').value=.35;$('glitchAmtB').value=.35;
  $('pixelAmtA').value=10;$('pixelAmtB').value=10;
  $('halfAmtA').value=8;$('halfAmtB').value=8;
  $('feedbackAmtA').value=.72;$('feedbackAmtB').value=.72;

  document.querySelectorAll('input[type=range]').forEach(el=>el.dispatchEvent(new Event('input')));
  clearCtx(chA.feedbackCtx);
  clearCtx(chB.feedbackCtx);
};

// ---------- FULLSCREEN / RECORD ----------
$('fullscreen').onclick=async()=>{
  try{
    if(!document.fullscreenElement) await stage.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){
    console.warn(err);
  }
};

$('record').onclick=()=>{
  if(state.recording){
    state.recorder?.stop();
    return;
  }
  if(!canvas.captureStream || !window.MediaRecorder){
    alert('このブラウザは録画に対応していません。Chrome / Edge を推奨します。');
    return;
  }

  const stream=canvas.captureStream(60);
  let mime='video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8';
  if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';

  const recorder=new MediaRecorder(stream,{
    mimeType:mime,
    videoBitsPerSecond:12000000
  });

  state.recorder=recorder;
  state.chunks=[];

  recorder.ondataavailable=e=>{
    if(e.data.size) state.chunks.push(e.data);
  };
  recorder.onstop=()=>{
    const blob=new Blob(state.chunks,{type:recorder.mimeType});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='live-mix-vj-fx-camera.webm';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    state.recording=false;
    $('record').textContent='● REC';
    $('record').classList.remove('active');
    statusEl.textContent='LIVE';
  };

  recorder.start(1000);
  state.recording=true;
  state.recStart=performance.now();
  $('record').textContent='■ STOP';
  $('record').classList.add('active');
  statusEl.textContent='REC';
};

// ---------- KEYBOARD ----------
// Important: range sliders can remain focused after a mouse operation.
// We therefore ignore shortcuts only while typing in textual fields or choosing a select.
document.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName;
  const type=document.activeElement?.getAttribute?.('type');
  const isTyping =
    tag==='TEXTAREA' ||
    tag==='SELECT' ||
    (tag==='INPUT' && !['range','button','checkbox','radio'].includes(type));

  if(isTyping) return;

  const key=e.key.toLowerCase();

  if(e.code==='Space'){
    e.preventDefault();
    if(videoA.paused && videoB.paused) $('playBoth').click();
    else $('pauseBoth').click();
    return;
  }

  if(['1','2','3'].includes(key)){
    e.preventDefault();
    $('crossfade').value = key==='1' ? 0 : key==='2' ? .5 : 1;
    $('crossfade').dispatchEvent(new Event('input'));
    return;
  }

  const keysA={
    q:'rgbA',
    w:'glitchA',
    e:'pixelA',
    r:'halfA',
    t:'feedbackA',
    y:'invertA'
  };
  const keysB={
    a:'rgbB',
    s:'glitchB',
    d:'pixelB',
    f:'halfB',
    g:'feedbackB',
    h:'invertB'
  };

  if(keysA[key]){
    e.preventDefault();
    $(keysA[key]).click();
  }else if(keysB[key]){
    e.preventDefault();
    $(keysB[key]).click();
  }
});

// Cleanup camera tracks if the page is closed.
window.addEventListener('beforeunload',()=>{
  stopStream('streamA','cameraA');
  stopStream('streamB','cameraB');
});
